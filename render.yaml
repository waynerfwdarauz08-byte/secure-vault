services:
  - type: web
    name: securevault-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEYS
        sync: false
      - key: ACTIVE_ENCRYPTION_KEY_ID
        value: v1
      - key: DB_TLS
        value: 'true'
      - key: DB_CA
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: TRUSTED_PROXIES
        sync: false
      - key: MAIL_TRANSPORT
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
